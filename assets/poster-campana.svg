<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1450" viewBox="0 0 1000 1450" role="img" aria-labelledby="title desc">
<title id="title">Recycle Today, Protect Tomorrow — Intercultural awareness campaign</title>
<desc id="desc">Australia and Colombia recycle together. A poster promoting responsible plastic disposal, community action, and environmental education.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2732"/><stop offset=".55" stop-color="#075454"/><stop offset="1" stop-color="#083144"/></linearGradient>
 <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E4FF8B"/><stop offset="1" stop-color="#90F2A9"/></linearGradient>
 <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#54E2BD"/><stop offset="1" stop-color="#1475AB"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#B8F7A4" stop-opacity=".3"/><stop offset="1" stop-color="#B8F7A4" stop-opacity="0"/></radialGradient>
 <filter id="shadow"><feGaussianBlur stdDeviation="22"/></filter>
</defs>
<rect width="1000" height="1450" fill="url(#bg)"/>
<circle cx="520" cy="665" r="530" fill="url(#halo)"/>
<circle cx="870" cy="165" r="310" fill="#D7F58D" opacity=".07"/>
<circle cx="72" cy="870" r="230" fill="#7DDDD6" opacity=".09"/>
<g font-family="Arial, sans-serif" fill="#EEFCEF">
 <rect x="68" y="64" width="390" height="54" rx="27" fill="#D5F8A7" opacity=".16" stroke="#A7EDA5"/>
 <text x="263" y="99" font-size="20" letter-spacing="3" text-anchor="middle" font-weight="bold">AUSTRALIA  ×  COLOMBIA</text>
 <text x="80" y="213" font-size="106" font-weight="900" letter-spacing="-4">RECYCLE</text>
 <text x="80" y="309" font-size="116" font-weight="900" letter-spacing="-5" fill="url(#lime)">TODAY.</text>
 <text x="80" y="402" font-size="106" font-weight="900" letter-spacing="-4">PROTECT</text>
 <text x="80" y="501" font-size="112" font-weight="900" letter-spacing="-5" fill="url(#lime)">TOMORROW.</text>
</g>
<g transform="translate(490 745)">
 <circle r="248" fill="url(#water)" stroke="#C3F5A0" stroke-width="13"/>
 <circle r="216" fill="none" stroke="#D4FFCF" stroke-width="2" stroke-opacity=".45"/>
 <path d="M-170-105 Q-108-159 -40-139 L16-97 4-59 -55-45 -79-3 -118 6 -128 62 -160 45 -186-20Z" fill="#BFF28D"/>
 <path d="M25-148 Q112-171 182-97 L139-49 114-56 90-21 32-30 1-84Z" fill="#BFF28D"/>
 <path d="M53 8 Q88-13 125 23 L137 78 93 142 43 124 19 81 22 34Z" fill="#BFF28D"/>
 <path d="M-88 55 L-32 39 14 71 -1 126 -38 166 -89 130 -107 88Z" fill="#BFF28D"/>
 <ellipse cx="-85" cy="-188" rx="170" ry="60" transform="rotate(-34)" fill="#FFF" opacity=".14"/>
 <path d="M-270 12 Q0-310 266-8" fill="none" stroke="#EBFFB1" stroke-width="15" stroke-linecap="round" stroke-dasharray="3 29"/>
 <g transform="translate(-12 20)" font-family="Arial, sans-serif" font-size="200" font-weight="bold" fill="#FFFFFF"><text x="0" y="66" text-anchor="middle" opacity=".96">♻</text></g>
</g>
<g transform="translate(100 980)">
 <rect x="0" y="0" width="800" height="113" rx="24" fill="#D8F7AC"/>
 <text x="400" y="42" text-anchor="middle" font-size="29" fill="#0C393A" font-family="Arial,sans-serif" font-weight="bold">IF WE RECYCLE TODAY,</text>
 <text x="400" y="83" text-anchor="middle" font-size="31" fill="#07523C" font-family="Arial,sans-serif" font-weight="bold">WE WILL PROTECT TOMORROW.</text>
</g>
<g transform="translate(100 1114)">
 <rect width="800" height="98" rx="22" fill="#D6F7FA" opacity=".96"/>
 <text x="400" y="40" text-anchor="middle" font-size="27" fill="#0C393A" font-family="Arial,sans-serif" font-weight="bold">IF EVERYONE RECYCLED,</text>
 <text x="400" y="76" text-anchor="middle" font-size="27" fill="#07523C" font-family="Arial,sans-serif" font-weight="bold">OUR COMMUNITY WOULD BE CLEANER.</text>
</g>
<g font-family="Arial,sans-serif" font-weight="bold" text-anchor="middle">
 <rect x="90" y="1250" width="242" height="84" rx="20" fill="#FFFFFF" opacity=".12" stroke="#B5FAAF"/>
 <rect x="379" y="1250" width="242" height="84" rx="20" fill="#FFFFFF" opacity=".12" stroke="#B5FAAF"/>
 <rect x="668" y="1250" width="242" height="84" rx="20" fill="#FFFFFF" opacity=".12" stroke="#B5FAAF"/>
 <text x="211" y="1284" font-size="22" fill="#C9FE92">01 · LEARN</text><text x="211" y="1310" font-size="16" fill="#F3FEF2">Education</text>
 <text x="500" y="1284" font-size="22" fill="#C9FE92">02 · COLLECT</text><text x="500" y="1310" font-size="16" fill="#F3FEF2">Clean recyclables</text>
 <text x="789" y="1284" font-size="22" fill="#C9FE92">03 · SUPPORT</text><text x="789" y="1310" font-size="16" fill="#F3FEF2">Local recyclers</text>
 <text x="500" y="1390" font-size="20" fill="#D8FCD9" letter-spacing="2">SCAN THE VIDEO QR ON OUR CAMPAIGN WEBSITE</text>
</g>
</svg>